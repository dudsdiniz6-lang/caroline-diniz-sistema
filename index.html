<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Centro de Estética Caroline Diniz</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div id="login-screen" class="login-screen">
    <div class="login-box">
      <h1>Caroline Diniz</h1>
      <p>Sistema de gestão</p>

      <input id="loginUsuario" type="text" placeholder="Usuário" />
      <input id="loginSenha" type="password" placeholder="Senha" />

      <button onclick="fazerLogin()">Entrar</button>
    </div>
  </div>

  <div id="app" class="app" style="display:none;">

    <aside class="sidebar">
      <h2>Caroline Diniz</h2>

      <nav>
        <button onclick="mostrarTela('agenda')">Agenda</button>
        <button onclick="mostrarTela('clientes')">Clientes</button>
        <button onclick="mostrarTela('profissionais')">Profissionais</button>
        <button onclick="mostrarTela('servicos')">Serviços</button>
        <button onclick="mostrarTela('pacotes')">Pacotes</button>
        <button onclick="mostrarTela('comandas')">Comandas</button>
        <button onclick="mostrarTela('relatorios')">Relatórios</button>
        <button onclick="mostrarTela('configuracoes')">Configurações</button>
        <button onclick="mostrarTela('caixa')">Caixa</button>
        <button onclick="mostrarTela('comissoes')">Comissões</button>
        <button onclick="sairSistema()">Sair</button>
      </nav>
    </aside>

    <main class="main">

      <section id="tela-agenda" class="tela ativa">
        <div class="topo">
          <div>
            <h1>Agenda</h1>
            <div id="resumoAlertasAgenda"></div>
            <p id="dataAgendaTexto"></p>
          </div>

          <div class="acoes">
            <button onclick="voltarDia()">◀</button>
            <button onclick="irHoje()">Hoje</button>
            <button onclick="avancarDia()">▶</button>
            <input
  id="calendarioAgenda"
  type="date"
  onchange="mudarDataAgendaPeloCalendario()"
  style="width:160px;margin-bottom:0;"
>
            <button class="principal" onclick="abrirModalAgendamento()">Novo agendamento</button>
          </div>
        </div>

        <div class="filtros">
          <input id="buscaAgenda" placeholder="Buscar cliente..." oninput="carregarAgenda()" />
        </div>

        <div id="agendaGrade" class="agenda-grade"></div>
      </section>

      <section id="tela-clientes" class="tela">
        <div class="topo">
          <h1>Clientes</h1>
          <button class="principal" onclick="abrirModalCliente()">Novo cliente</button>
        </div>
        <div class="filtros">
  <input
    id="buscaCliente"
    placeholder="Pesquisar cliente por nome ou telefone..."
    oninput="carregarClientes()"
  >
</div>

        <div id="listaClientes" class="cards"></div>
      </section>

      <section id="tela-profissionais" class="tela">
        <div class="topo">
          <h1>Profissionais</h1>
          <button class="principal" onclick="abrirModalProfissional()">Novo profissional</button>
        </div>

        <div id="listaProfissionais" class="cards"></div>
      </section>

      <section id="tela-servicos" class="tela">
        <div class="topo">
          <h1>Serviços</h1>
          <button class="principal" onclick="abrirModalServico()">Novo serviço</button>
        </div>

        <div id="listaServicos" class="tabela"></div>
      </section>

      <section id="tela-pacotes" class="tela">
        <div class="topo">
          <h1>Pacotes</h1>
          <button class="principal" onclick="abrirModalPacote()">Novo pacote</button>
        </div>

        <div id="listaPacotes" class="cards"></div>
      </section>

   <section id="tela-comandas" class="tela">
  <div class="topo">
    <h1>Comandas</h1>
    <button class="principal" onclick="carregarComandas()">Atualizar</button>
  </div>
<div class="filtros">
  <input
    id="buscaComanda"
    placeholder="Pesquisar por cliente ou serviço..."
    oninput="carregarComandas()"
  >
</div>
  <div id="listaComandas" class="cards"></div>
</section>   
      <section id="tela-relatorios" class="tela">

  <div class="topo">
    <h1>Relatórios</h1>
  </div>

  <div class="cards">

    <div class="card">
      <h3>Atendimentos por profissional</h3>
      <button class="principal" onclick="abrirRelatorioProfissional()">
        Abrir
      </button>
    </div>

    <div class="card">
      <h3>Pacotes vencendo</h3>
      <button class="principal" onclick="abrirRelatorioPacotesVencendo()">
        Abrir
      </button>
    </div>

    <div class="card">
      <h3>Resumo geral de vendas</h3>
      <button class="principal" onclick="abrirRelatorioVendas()">
        Abrir
      </button>
    </div>

    <div class="card">
      <h3>Resumo de pacotes</h3>
      <button class="principal" onclick="abrirRelatorioPacotes()">
        Abrir
      </button>
    </div>

    <div class="card">
      <h3>Clientes sumidos</h3>
      <button class="principal" onclick="abrirRelatorioClientesSumidos()">
        Abrir
      </button>
    </div>

    <div class="card">
      <h3>Clientes devendo</h3>
      <button class="principal" onclick="abrirRelatorioClientesDevendo()">
        Abrir
      </button>
    </div>

  </div>

  <div id="areaRelatorios"></div>

</section>
      <section id="tela-caixa" class="tela">
        <div class="topo">
          <h1>Caixa</h1>
          <button class="principal" onclick="abrirCaixa()">Abrir caixa</button>
        </div>

        <div id="listaCaixas" class="cards"></div>
      </section>

      <section id="tela-comissoes" class="tela">
        <div class="topo">
          <h1>Comissões</h1>
          <button class="principal" onclick="carregarComissoes()">Atualizar</button>
        </div>

        <div id="listaComissoes" class="cards"></div>
      </section>

    </main>
  </div>

  <div id="modal" class="modal">
    <div id="modalConteudo" class="modal-conteudo"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>

</body>
</html>
