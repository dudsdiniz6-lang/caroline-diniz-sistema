<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caroline Diniz Centro de Estética</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <aside class="sidebar">
      <h1>CD</h1>

      <ul>
        <li>Agenda</li>
        <li>Clientes</li>
        <li>Profissionais</li>
        <li>Relatórios</li>
        <li>Financeiro</li>
      </ul>
    </aside>

    <main class="content">

      <header>
        <h2>Agenda do Dia</h2>

        <button>
          Novo Agendamento
        </button>
      </header>

      <section class="agenda">

        <div class="card">
          <h3>Maria Oliveira</h3>

          <p>Limpeza de Pele</p>

          <span>14:00 - 15:00</span>
        </div>

        <div class="card">
          <h3>Ana Paula</h3>

          <p>Massagem Relaxante</p>

          <span>15:20 - 16:20</span>
        </div>

      </section>

    </main>

  </div>

  <script src="script.js"></script>

</body>
</html>
